<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f3ed" />
    <title>Учёт трат</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Личные финансы</p>
          <h1>Учёт трат</h1>
          <p class="subtitle">Записывайте расходы и держите бюджет под контролем.</p>
        </div>
        <div class="hero-mark" aria-hidden="true">₸</div>
      </header>

      <section class="expense-form-card" aria-labelledby="form-title">
        <div class="section-heading">
          <span class="section-number">01</span>
          <div>
            <h2 id="form-title">Новая трата</h2>
            <p>Заполните данные о покупке</p>
          </div>
        </div>

        <form id="expense-form">
          <div class="form-grid">
            <label class="field">
              <span>Сумма</span>
              <span class="input-with-suffix">
                <input id="amount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0" required />
                <span>₸</span>
              </span>
            </label>

            <label class="field">
              <span>Категория</span>
              <select id="category" name="category" required>
                <option value="Еда">Еда</option>
                <option value="Транспорт">Транспорт</option>
                <option value="Дом">Дом</option>
                <option value="Расходы на кредит">Расходы на кредит</option>
                <option value="Другое">Другое</option>
              </select>
            </label>

            <label class="field">
              <span>Дата</span>
              <input id="date" name="date" type="date" required />
            </label>

            <label class="field field-wide">
              <span>Комментарий <small>необязательно</small></span>
              <input id="comment" name="comment" type="text" maxlength="120" placeholder="Например, обед с коллегами" />
            </label>
          </div>
          <button class="submit-button" type="submit">
            <span>Добавить трату</span>
            <span aria-hidden="true">→</span>
          </button>
        </form>
      </section>

      <section class="expenses-section" aria-labelledby="expenses-title">
        <div class="expenses-header">
          <div class="section-heading">
            <span class="section-number">02</span>
            <div>
              <h2 id="expenses-title">Последние траты</h2>
              <p>Новые записи отображаются первыми</p>
            </div>
          </div>
          <div class="monthly-total">
            <span>За текущий месяц</span>
            <strong id="monthly-total">0 ₸</strong>
          </div>
        </div>

        <div id="expense-list" class="expense-list" aria-live="polite"></div>
      </section>
    </main>

    <template id="expense-template">
      <article class="expense-item">
        <div class="category-icon" aria-hidden="true"></div>
        <div class="expense-main">
          <div class="expense-title-row">
            <h3 class="expense-category"></h3>
            <strong class="expense-amount"></strong>
          </div>
          <div class="expense-meta">
            <time class="expense-date"></time>
            <span class="expense-comment"></span>
          </div>
        </div>
        <button class="delete-button" type="button" aria-label="Удалить трату">×</button>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
